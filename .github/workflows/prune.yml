name: prune ghcr.io

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - name: Prune
      uses: dataaxiom/ghcr-cleanup-action@v1.2.2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        owner: fhswf
        package: openai-proxy
        dry-run: false
        delete-untagged: true
        delete-tags: '^sha-.*'
        exclude-tags: latest
        use-regex: true
