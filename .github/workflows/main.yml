name: build

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}

  build:
    name: Build
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: SonarQube
      uses: sonarsource/sonarqube-scan-action@v8
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        # list of Docker images to use as base name for tags
        images: |
          ghcr.io/fhswf/openai-proxy          
        flavor: |
          latest=true
        labels: |
          org.opencontainers.image.description=OpenAI Proxy
          org.opencontainers.image.licenses=MIT
          org.opencontainers.image.source=https://github.com/fhswf/openai-proxy
        # generate Docker tags based on the following events/attributes
        tags: |
          type=sha,prefix=sha-,format=short,enable=true,priority=1100
          type=ref,event=branch
          type=raw,value=${{ needs.release.outputs.version || '0.0.0' }},enable=${{ needs.release.outputs.release_created == 'true' }}
          type=raw,value=${{ needs.release.outputs.major || '0' }}.${{ needs.release.outputs.minor || '0' }},enable=${{ needs.release.outputs.release_created == 'true' }}
          type=raw,value=${{ needs.release.outputs.major || '0' }},enable=${{ needs.release.outputs.release_created == 'true' }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        sbom: true

    - name: Update Kustomize image tag
      if: needs.release.outputs.release_created == 'true'
      uses: fjogeleit/yaml-update-action@v0.17.0
      with:
        valueFile: 'k8s/kustomization.yaml'
        propertyPath: 'images[0].newTag'
        value: ${{ needs.release.outputs.version }}
        branch: main
        message: 'Update image to ${{ needs.release.outputs.version }} [skip ci]'
